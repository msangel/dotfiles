---
is_container: >-
  {{
    ansible_facts.virtualization_type | default('')
    in ['docker', 'containerd', 'podman']
  }}

target_user: >-
  {{
    lookup('env', 'TARGET_USER')
    | default(lookup('env', 'SUDO_USER'), true)
    | default(lookup('env', 'USER'), true)
  }}

is_swift3: >-
  {{
    (ansible_facts.system_vendor | default('') | trim | lower) == 'acer'
    and
    (ansible_facts.product_name | default('') | trim | lower) == 'swift sf315-52'
  }}

numix_folder_style: "1"
numix_folder_colour: blue #green

xfce_gtk_theme: Arc-Dark
xfce_icon_theme: Numix-Circle
xfce_window_theme: Arc-Dark

ruby_version: "3.4.10"
rbenv_root: "{{ target_home }}/.rbenv"
xfce_custom_dpi: 128

swift3_audio_enabled: true
swift3_audio_enforce_tested_stack: true
swift3_audio_reboot: false

xfce_settings:
    - channel: xsettings
      property: /Net/ThemeName
      value: "{{ xfce_gtk_theme }}"
      type: string

    - channel: xsettings
      property: /Net/IconThemeName
      value: "{{ xfce_icon_theme }}"
      type: string

    - channel: xfwm4
      property: /general/theme
      value: "{{ xfce_window_theme }}"
      type: string

    - channel: xfwm4
      property: /general/mousewheel_rollup
      value: "false"
      type: bool

    - channel: thunar
      property: /last-show-hidden
      value: "true"
      type: bool

    - channel: xfwm4
      property: /general/workspace_count
      value: "1"
      type: int

    - channel: xfce4-terminal
      property: /scrolling-unlimited
      value: "true"
      type: bool

    - channel: xsettings
      property: /Xft/DPI
      value: "{{ xfce_custom_dpi }}"
      type: int

    - channel: xsettings
      property: /Xfce/LastCustomDPI
      value: "{{ xfce_custom_dpi }}"
      type: int
  
